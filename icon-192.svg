<svg xmlns="http://www.w3.org/2000/svg" viewBox="15 10 164 168">
  <!-- Phone body -->
  <rect x="24" y="18" width="72" height="114" rx="10" fill="none" stroke="#ffffff" stroke-width="5"/>
  <!-- Phone screen -->
  <rect x="32" y="30" width="56" height="82" rx="4" fill="rgba(255,255,255,0.08)"/>
  <!-- Phone notch -->
  <rect x="48" y="22" width="20" height="4" rx="2" fill="#ffffff" opacity="0.5"/>
  <!-- Phone home button -->
  <circle cx="60" cy="122" r="4" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
  <!-- Screen chart bars -->
  <rect x="38" y="88" width="8" height="18" rx="2" fill="#ffffff" opacity="0.6"/>
  <rect x="50" y="78" width="8" height="28" rx="2" fill="#ffffff" opacity="0.8"/>
  <rect x="62" y="68" width="8" height="38" rx="2" fill="#ffffff"/>
  <rect x="74" y="82" width="8" height="24" rx="2" fill="#ffffff" opacity="0.7"/>
  <!-- Screen checkmark -->
  <path d="M42 42 l8 8 16-16" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Calendar body -->
  <rect x="82" y="62" width="88" height="80" rx="10" fill="none" stroke="#ffffff" stroke-width="5"/>
  <!-- Calendar top bar -->
  <rect x="82" y="72" width="88" height="4" fill="#ffffff" opacity="0.3"/>
  <!-- Calendar hooks -->
  <rect x="100" y="56" width="5" height="14" rx="2.5" fill="#ffffff"/>
  <rect x="148" y="56" width="5" height="14" rx="2.5" fill="#ffffff"/>
  <!-- Calendar grid dots (4x3) -->
  <rect x="96" y="86" width="10" height="10" rx="3" fill="#ffffff" opacity="0.9"/>
  <rect x="112" y="86" width="10" height="10" rx="3" fill="#ffffff" opacity="0.6"/>
  <rect x="128" y="86" width="10" height="10" rx="3" fill="#ffffff" opacity="0.4"/>
  <rect x="144" y="86" width="10" height="10" rx="3" fill="#ffffff" opacity="0.7"/>
  <rect x="96" y="102" width="10" height="10" rx="3" fill="#ffffff" opacity="0.5"/>
  <rect x="112" y="102" width="10" height="10" rx="3" fill="#ffffff"/>
  <rect x="128" y="102" width="10" height="10" rx="3" fill="#ffffff" opacity="0.8"/>
  <rect x="144" y="102" width="10" height="10" rx="3" fill="#ffffff" opacity="0.3"/>
  <rect x="96" y="118" width="10" height="10" rx="3" fill="#ffffff" opacity="0.7"/>
  <rect x="112" y="118" width="10" height="10" rx="3" fill="#ffffff" opacity="0.4"/>
  <rect x="128" y="118" width="10" height="10" rx="3" fill="#ffffff" opacity="0.9"/>
  <rect x="144" y="118" width="10" height="10" rx="3" fill="#ffffff" opacity="0.6"/>
