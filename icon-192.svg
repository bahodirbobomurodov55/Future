  <path d="M24 156 h144" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
  <path d="M24 156 h96" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <!-- Streak dots -->
  <circle cx="32" cy="168" r="3" fill="#ffffff" opacity="0.4"/>
  <circle cx="44" cy="168" r="3" fill="#ffffff" opacity="0.6"/>
  <circle cx="56" cy="168" r="3" fill="#ffffff" opacity="0.8"/>
  <circle cx="68" cy="168" r="3" fill="#ffffff"/>
  <circle cx="80" cy="168" r="3" fill="#ffffff"/>
  <circle cx="92" cy="168" r="3" fill="#ffffff"/>
  <circle cx="104" cy="168" r="3" fill="#ffffff"/>
